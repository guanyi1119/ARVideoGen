# LongLive-RAG inference - pure Reward-Forcing backbone (no LoRA)
#
# Uses LatentMemCausalInferencePipeline with retrieval-augmented generation
# enabled.  The backbone is the base Reward-Forcing checkpoint; no LoRA
# adapter is loaded.
#
# Launch:
#     torchrun --nproc_per_node=8 inference_longlive_rag.py \
#         --config_path configs/longlive_rag/reward_forcing_latentmem.yaml

# Inference / denoising schedule
denoising_step_list: [1000, 750, 500, 250]
warp_denoising_step: true
num_frame_per_block: 3

# Model
model_name: Wan2.1-T2V-1.3B
model_kwargs:
  local_attn_size: 12
  timestep_shift: 5.0
  sink_size: 3
  memory_size: 6           # K - retrieved blocks per inference block
  recent_exclude: 5        # R - recent blocks excluded from retrieval
  use_latentmem: true      # master RAG switch
  compression_method: "ae"
  ae_ckpt: "datasets/longlive_rag/ae_latent_mem.pt"  # P1 AE checkpoint

# Data
data_path: prompts/vidprom_filtered_extended.txt
output_folder: videos/longlive_rag/reward_forcing_latentmem
num_output_frames: 120

# Sampling
use_ema: false
seed: 0
num_samples: 1
save_with_index: true
inference_iter: -1

# Generator checkpoint (TODO: replace with RF base checkpoint path)
generator_ckpt: "<TODO: replace with RF base checkpoint path>"

# NO lora_ckpt - pure Reward-Forcing
lora_ckpt:

# Noise / sink
global_sink: true
context_noise: 0

# Default config (merged with this file)
default_config_path: configs/longlive_rag/default_config.yaml
