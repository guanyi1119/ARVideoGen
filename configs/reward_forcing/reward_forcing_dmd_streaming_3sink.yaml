# reward_forcing_dmd_streaming_3sink.yaml
#
# 3-sink KV cache variant of reward_forcing_dmd_streaming.yaml.
#
# local_attn_size = 18 = 3 (long sink) + 6 (mid sink) + 9 (rolling window).
#   - long_sink: first N frames, kept with full precision (alpha=1.0).
#   - mid_sink:  next M frames, kept with partial precision (alpha=0.8).
#   - rolling:   remaining frames within the sliding window.
#
# The three-tier sink replaces the single sink_size field.

generator_ckpt: /cache/reward_forcing_dmd.pt
reward_model_path: /cache/VideoReward
generator_fsdp_wrap_strategy: size
real_score_fsdp_wrap_strategy: size
fake_score_fsdp_wrap_strategy: size
real_name: Wan2.1-T2V-14B
fake_name: Wan2.1-T2V-1.3B
text_encoder_fsdp_wrap_strategy: size
text_encoder_cpu_offload: true
denoising_step_list:
- 1000
- 750
- 500
- 250
warp_denoising_step: true
ts_schedule: false
num_train_timestep: 1000
timestep_shift: 5.0
guidance_scale: 3.0
denoising_loss_type: flow
mixed_precision: true
seed: 0
sharding_strategy: full
lr: 1.0e-05
lr_critic: 2.0e-06
beta1: 0.0
beta2: 0.999
beta1_critic: 0.0
beta2_critic: 0.999
data_path: /cache/vidprom_filtered_extended.txt
switch_prompt_path: /cache/vidprom_filtered_extended_switch.txt
batch_size: 1
gradient_accumulation_steps: 1
ema_weight: 0.99
ema_start_step: 200
total_batch_size: 64
log_iters: 500
max_checkpoints: 3
max_iters: 3000

negative_prompt: '色调艳丽，过曝，静态，细节模糊不清，字幕，风格，作品，画作，画面，静止，整体发灰，最差质量，低质量，JPEG压缩残留，丑陋的，残缺的，多余的手指，画得不好的手部，画得不好的脸部，畸形的，毁容的，形态畸形的肢体，手指融合，静止不动的画面，杂乱的背景，三条腿，背景人很多，倒着走'
dfake_gen_update_ratio: 5
image_or_video_shape:
- 1
- 240
- 16
- 60
- 104
distribution_loss: dmd_switch_3sink
global_sink: true
trainer: streaming_distillation
gradient_checkpointing: true
num_frame_per_block: 3
load_raw_video: false
beta: 1.0
model_kwargs:
  timestep_shift: 5.0
  local_attn_size: 18
  long_sink_size: 3
  mid_sink_size: 6
  long_compression_alpha: 1.0
  mid_compression_alpha: 0.8

# Visualization
vis_interval: 500
vis_ema: false
vis_video_lengths:
- 240
val_batch_size: 1
val_data_path: /cache/vidprom_filtered_extended.txt
val_switch_prompt_path: /cache/vidprom_filtered_extended_switch.txt

slice_last_frames: 21

switch_mode: random_choice
switch_choices:
- 21
- 39
- 57
- 75
- 93
- 111
- 129
- 147
- 165
- 183
- 201

streaming_training: true
streaming_chunk_size: 21
streaming_max_length: 240

streaming_min_new_frame: 18
train_first_chunk: true

# Unified CFG: probability of zeroing sink / window KV cache regions during
# the generator rollout.  When zeroing fires, a second generation pass is
# performed with the degraded cache and used as the uncond reference in the
# CFG loss computation.  Range: 0.0–1.0 (e.g. 0.3 = 30% chance per chunk).
# Both default to 0.0 (disabled, original behaviour).
sink_kv_cache_zero_prob: 0.1
window_kv_cache_zero_prob: 0.1

last_step_only: false

# ---------------------------------------------------------------------------
# Teleport mitigation / prompt_rewrite — pluggable VLM-based prompt rewrite at
# the switch boundary.  Default OFF: when ``enabled: false`` (or this block is
# absent), the pipeline is byte-for-byte equivalent to the unmodified main
# branch.  See methods/reward_forcing/teleport/ for the implementation.
# ---------------------------------------------------------------------------
teleport:
  prompt_rewrite:
    enabled: false                       # master switch; false = no-op
    trigger: switch                      # switch (default) | chunk
    vlm:
      type: qwen_vl_3b                   # qwen_vl_3b | qwen_vl | disabled
      model_path: Qwen/Qwen2.5-VL-3B-Instruct
      device: cuda
      max_new_tokens: 256
    rewriter:
      mode: conservative                 # off | conservative | aggressive

## LoRA Configuration
adapter:
  type: "lora"
  rank: 256
  alpha: 256
  dropout: 0.0
  dtype: "bfloat16"
  apply_to_critic: true
  verbose: true
