# Generator-level enlarged CFG: three independent probability switches control
# which uncond degradations are applied when the dual generation fires.
# kv_cache_cfg_scale controls the CFG strength (0 = no combination).
#   - sink_kv_cache_zero_prob:   zero the sink region of KV cache
#   - window_kv_cache_zero_prob:  zero the window region of KV cache
#   - neg_prompt_zero_prob:       use negative prompt for the uncond pass
# All default to 0.0 (disabled, original single-generation behaviour).
kv_cache_cfg_scale: 3.0
sink_kv_cache_zero_prob: 0.1
window_kv_cache_zero_prob: 0.1
neg_prompt_zero_prob: 0.1

last_step_only: false

# ---------------------------------------------------------------------------
# Teleport mitigation / prompt_rewrite — pluggable VLM-based prompt rewrite at
# the switch boundary.  Default OFF: when ``enabled: false`` (or this block is
# absent), the pipeline is byte-for-byte equivalent to the unmodified main
# branch.  See methods/reward_forcing/teleport/ for the implementation.
# ---------------------------------------------------------------------------
teleport:
  prompt_rewrite:
    enabled: false                       # master switch; false = no-op
    trigger: switch                      # switch (default) | chunk
    registry_enabled: true               # cross-chunk entity state machine
    vlm:
      type: qwen_vl_3b                   # qwen_vl_3b | qwen_vl | disabled
      model_path: Qwen/Qwen2.5-VL-3B-Instruct
      device: cuda
      max_new_tokens: 256
    rewriter:
      mode: conservative                 # off | conservative | aggressive

  # === T10: tel_det_regular teleport mitigation (mutex-gated, default off) ===
  tel_det_regular:
    mode: "off"                          # off | reweight | aux_loss (mutex)
    # Metric aggregation thresholds (also used by scripts/eval_teleport_rate.py)
    score_threshold: 0.8                # per-pixel score threshold for event detection
    min_event_area_ratio: 0.001          # fraction of pixels above threshold to count a frame as event
    detector:
      type: multi_frame_chained          # multi_frame_chained | multi_frame_direct | optical_flow | optical_flow_no_raft | disabled
      tau: 5                             # temporal window for multi-frame flow (chained mode reuses adjacent flows)
      downsample_factor: 4
      flow_backend: raft_small           # raft_small | none
      edge_sigma: 0.15
      flow_model_path: /cache/raft_small_C_T_V2.pth  # optional local weight; omit to auto-download
    reweighter:
      type: absolute                     # teacher_relative | absolute | thresholded | disabled
      alpha: 5.0
      latent_h: 40
      latent_w: 72
    aux_loss:
      type: masked_mean                  # masked_mean | disabled
      threshold: 0.3                     # aux-loss internal masking cut-off (distinct from detector.tau)
      aggregation: masked_mean
    aux_beta: 1.0

## LoRA Configuration
adapter:
  type: "lora"
  rank: 256
  alpha: 256
  dropout: 0.0
  dtype: "bfloat16"
  apply_to_critic: true
  verbose: true
